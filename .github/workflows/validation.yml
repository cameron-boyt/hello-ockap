name: validation
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the action requires it; the built-in
                                                      # ephemeral token is enough
          GITLEAKS_ENABLE_SUMMARY: "false"   # findings in the job summary are public on a public repo
          GITLEAKS_ENABLE_COMMENTS: "false"  # a PR comment needs pull-requests: write, and the
                                             # failing check is already the feedback
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run pytest --cov     # needs pytest-cov in the dev group (A.1), or this
                                     # fails on an argparse error naming no dependency

  build:
    name: Build validation image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true              # into the local daemon; never pushed
          tags: validation:pr
      - name: Start it and prove it answers
        run: |
          docker run -d --name validation-test -p 8000:8000 validation:pr
          for i in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          echo "service never became healthy"
          docker logs validation-test
          exit 1