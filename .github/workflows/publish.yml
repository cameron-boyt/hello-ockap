name: publish
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write        # required to sign the attestation
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # github.repository preserves the owner's capitalisation; GHCR requires the whole
          # path lowercase and rejects the push with "invalid reference format". If your
          # login contains a capital, lowercase it here. A.9 hits the same wall.
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      # Attest the DIGEST. The tag is a name; the digest is the bytes.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true